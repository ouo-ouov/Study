<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>text 1</p>
    <a href = "https://www.gilbut.co.kr">길벗</a>
    <a href = "https://www.google.com">구글</a>

    <script>
        const childNodes = document.body.childNodes;
        /*
            childNodes 속성을 사용하면 <body>의 모든 자식노드(텍스트포함)를
            NodeList(유사배열)에 담아 NodeList(유사배열)를 반환해 줍니다.

            참고. NodeList 유사배열을 실제 일반배열로 변환해서 작업해야 함

            참고. NodeList 유사배열을 일반배열로 변환 하는 방법

                Array 객체의 from(NodeList 유사배열); 메소드 호출하면
                실제 일반배열에 모든 자식노드들을 모두 담아 일반배열을 반환해 줍니다. 
        */
        //참고 코드.
        //Array.from(childNodes) // -> [<p>text 1</p>, <a>길벗</a>, <a>구글</a>] 일반배열로 반환

        Array.from(childNodes).forEach(function(node){

            if(node.nodeName === "A"){

                //부모 <body> 를 기준으로 자식 <a> 두 쌍을 반복해서 삭제
                node.parentNode.removeChild(node);

            }

        });

    </script>
    
</body>
</html>
