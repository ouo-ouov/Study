<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- [실습15] 실습A ranking.html - ol태그로 인기 영화 TOP5 만들기 -->
    <h1>인기 영화 TOP5</h1>

    <!-- ol태그는 1, 2, 3 처럼 순서가 중요한 목록을 만들 때 사용합니다. 

         ol태그에 list-style-type속성의 값을 여러 종류 중 하나씩 설정하면 다른 순서 종류의 화면을 보게 된다. 
                 list-style-type속성에 설정할 값 종류
                     decimal     : 1, 2, 3 ....
                     upper-alpha : A, B, C ....
                     lower-alpha : a, b, c ....
                     upper-roman : |, ||, ||| ....
                     lower-roman : i, iii, iii ....
    -->
    <ol>
        <li>1위 영화</li>
        <li>2위 영화</li>
        <li>3위 영화</li>
        <li>4위 영화</li>
        <li>5위 영화</li>
    </ol>
    <hr>
    <ol style="list-style-type: upper-alpha;">
        <li>1위 영화</li>
        <li>2위 영화</li>
        <li>3위 영화</li>
        <li>4위 영화</li>
        <li>5위 영화</li>
    </ol>
    <hr>
    <ol style="list-style-type: lower-roman;">
        <li>1위 영화</li>
        <li>2위 영화</li>
        <li>3위 영화</li>
        <li>4위 영화</li>
        <li>5위 영화</li>
    </ol>
</body>
</html>
