<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>상품 소개 페이지</title>
  <style>
    
    /* 
        # <- id속성의값으로 요소를 선택해 오는 아이디 선택자 기호

        작성방법
                #id속성의값 {
                            속성명: 값;
                }
        예
                #a -> id속성에 설정된 값이 a인 <div>텍스트 텍스트</div> 요소 하나만 선택해서       
        
                #a {
                 background-color: red;
                
                }
                <div id="a">텍스트 텍스트</div>
    */

    /* #id선택자 기호를 이용해
       id속성에 설정된 값이 container라고 작성된 <div>....</div>요소 한쌍을 선택해서

       - 너비 길이를 500px로 설정
       - 바깥 테두리 선 굵기를 1px로 설정, 바깥 테두리 선 종류 가는 실선, 바깥테두리 선 색상 검정색 설정
    */
    #container {
      width: 500px;
      border: 1px solid black;
      padding: 10px;
      margin: 10px auto;
    }
  
  </style>
</head>
<body>
  <div id="container">
    <h1>레드향</h1>
    <p>껍질에 붉은 빛이 돌아 레드향이라 불린다.</p>
    <p>레드향은 한라봉과 귤을 교배한 것으로 일반 귤보다 2~3배 크고, 과육이 붉고 통통하다.</p>
    <p>비타민 C와 비타민 P가 풍부해 혈액순환, 감기예방 등에 좋은 것으로 알려져 있다.</p>
  </div>
</body>
</html>
