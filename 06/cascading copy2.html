<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>상품 소개 페이지</title>

  <!-- 
        <style></style> <-한쌍 : css 선언문 태그
  -->


  <style>
        /* -------------------------- 
            css 제작자 스타타일
            - 같은 요소에 여러 규칙이 겹칠때
              캐스케이딩 우선순위를 보여주는 예제
           --------------------------
        */

        /* 태그명 선택자인 p 태그명을 작성하여 아래에 작성된 모든 <p></p>요소 3쌍을 한 번에 선택해 스타일 정의 */
        p {
          color: black; /* 1번규칙 : p요소들 내부에 작성된 글자색을 검정으로 설정 */
        }

        /* 태그명 선택자인 h1 태그명을 작성하여 아래에 작성된 모든 <h1>레드향</h1>요소 한 쌍을 선택해 스타일 정의 */
        h1 {
            /* 2번규칙 : h1 요소 내부에 작성된 글자색을 갈색으로 설정 
                        !important -> 어떤 규칙 보다 최우선으로 브라우저에 적용될 수 있게 하는 단어
            */  
            color: brown !important;  
        }

        /* 태그명 선택자인 p 태그명을 작성하여 아래에 작성된 모든 <p></p>요소 3쌍을 한 번에 선택해 스타일 정의 */ 
        p {
          color: blue; /* 3번규칙 : p요소들 내부에 작성된 글자색을 파랑으로 설정
                                     (1번 규칙에 작성한 p요소의 clolr:black; 보다 아래에 작성되어 덮어씀)     
                         */
        }

  </style>

</head>
<body>
  <!-- 
      인라인 스타일 작성 방법
      - 제작자 css보다 우선순위가 높음
      - 하지만 !important가 작성되어 있으면 !important 쪽이 최종 브라우저에 적용되어 나타남
  -->
  <h1 style="color: red;">레드향</h1>
  <!-- 
      결과 : 갈색(brown) 으로 "레드향" 브라우저에 최종 나타남 !!
      이유 : 인라인 스타일 작성방법에서 colro : red; 으로 설정 했지만,
            제작자 스타일 시트 작성방법에서 h1 { color: brown !important; } 가 더 강력 -> 브라우저에 갈색이 적용됨
  -->


  <p style="color: red;">껍질에 붉은 빛이 돌아 레드향이라 불린다.</p>
  <!-- 결과 : 빨강(red)
       이유 : p에는 css에서 blue 규칙이 있지만,
             인라인 스타일 color:red; 가 더 우선순위 높음 -> 빨강적용
  -->
  <p>레드향은 한라봉과 귤을 교배한 것으로</p>
  <p>일반 귤보다 2~3배 크고, 과육이 붉고 통통하다.</p>    
</body>
</html>
