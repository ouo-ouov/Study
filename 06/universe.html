<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>상품 소개 페이지</title>
  <!-- 
        전체 선택자 *
            - html 파일에 작성된 모드 태그(요소)들을 한 번에 선택해오는 선택자 기호
            - 기본 작성 문법
                * {
                    속성명:설정값;            
                }
  -->
    <style>

          /*  * < 전체 선택자 기호를 이용해 모든 HTML태그들을 선택해서 스타일 정의 */
          /* margin: 위쪽바깥여백띄울값 오른쪽바깥여백띄울값 아래쪽바깥여백띄울값 왼쪽바깥여백띄울값; */

          * {
            /*
              html 파일에 작성된 모든 태그들을 한 번에 선택해
              모든 태그의 '바깥 여백(margin)'을 0으로 설정
              -> 브라우저가 자동으로 넣는 기본 여백을 없앰
            */
            margin: 0px;
          }
          
    </style>


</head>
<body>
  <img src="images/cat.jpg">
</body>
</html>
