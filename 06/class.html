<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>상품 소개 페이지</title>
  <!--
      클래스선택자  .class속성에설정된_값
      
      - 클래스 선택자  .class속성에설정된_값은은
        HTML 태그에 class="값" 이 작성된, 특정 그룹에 속하는 태그들만 선택하는 선택자
        
      - 문법
            .class속성값 {
                     속성명 :값;
                    }  
      - 설명

            -->
  <style>
    p {
       font-style: italic;
    }

    /* 클래스 선택자 .accent
       - HTML 태그에 class="accent" 라고 작성되어 있는 요소 전부를 선택
       - h1, span 요소가 class="accent" 이므로 둘 다 선택 됨 
    */

    .accent {
             background-color: rgb(240, 129, 129);
             border: 1px dotted black; /* 바깥 테두리 선 굵기 1px 로 설정,
                                            바깥 테두리 선 종류 점선으로 설정,
                                            바깥 테두리 선 색상 검정으로 설정
                                         */
    }

    /*

    .   <- class속성에 대한~~~
    .bg <- class속성에 대한~~~ class속성값이 bg라고 작성된 h1요소 선택
    .bg {} <- class속성에 대한~~~ class속성값이 bg라고 작성된 h1요소 선택 {} 사이에 스타일 정의

    */

    .bg {
         font-size: 100px; /* 글자 크기 100px 로 설정*/
         color: rgb(180, 13, 13);     /* 글자 색상 빨강으로 설정 */
         

    }
  </style>
</head>
<body>
  <div>
    <h1 class="accent bg">레드향</h1>
    <p>껍질에 붉은 빛이 돌아 <span class="accent">레드향</span>이라 불린다.</p>
    <p>레드향은 한라봉과 귤을 교배한 것으로 일반 귤보다 2~3배 크고, 과육이 붉고 통통하다.</p>
    <p>비타민 C와 비타민 P가 풍부해 혈액순환, 감기예방 등에 좋은 것으로 알려져 있다.</p>
  </div>
</body>
</html>
