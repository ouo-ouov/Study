<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>상품 소개 페이지</title>

  <!-- css 코드 작성 방법 2. 내부스타일시트 작성 방법

                           확장자가 .html인 문서 내부의 <head></head>태그 사이에
                           <style></style> 선언문 태그를 작성해놓고
                           <style></style> 사이에 css 코드를 작성하는 방법. 
  -->
    <style>
      /*
       css코드 작성 문법
            html태그를 다양하게 선택할 수 있게 하는 문법 {
              속성명1: 속성값1;
              속셩명2: 속성값2;            
            }
              태그명 선택자 -> 태그명
              id 선택자    -> #id속성값
              class선택자  -> .class속성값
      */
      /* h1 태그명 선택자로
         <h1>레드향</h1> 태그를 선택해서 가져와 { } 사이에 스타일을 설정하겠다.      
      */
      h1 {
        background-color: black; /* 선택한 h1태그 영역의 배경색을 검정색으로 설정 */
        color: white;            /* 선택한 h1태그 영역에 작성된 텍스트 색상을 흰색으로 설정 */
        padding: 10px;             /* 선택한 h1태그 영역에 작성된 텍스트 기준으로 안쪽 여백을 모두 10px 만큼 띄움 설정 */
      }

    </style>
</head>
<body>
  <h1>레드향</h1>
  <p>껍질에 붉은 빛이 돌아 레드향이라 불린다.</p>
  <p>레드향은 한라봉과 귤을 교배한 것으로 일반 귤보다 2~3배 크고, 과육이 붉고 통통하다.</p>
  <p>비타민 C와 비타민 P가 풍부해 혈액순환, 감기예방 등에 좋은 것으로 알려져 있다.</p>
</body>
</html>
