<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자주 가는 사이트 링크</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
            background: linear-gradient(180deg, #e3f2fd 0%, #b3e5fc 50%, #81d4fa 100%);
            color: #0d47a1;
        }

        .link-card {
            width: min(400px, 100%);
            padding: 2.5rem 2rem;
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            border: 2px solid #90caf9;
            box-shadow: 0 16px 40px rgba(33, 150, 243, 0.2);
        }

        h1 {
            margin-bottom: 0.5rem;
            font-size: 1.6rem;
            color: #1565c0;
        }

        .subtitle {
            margin-bottom: 2rem;
            font-size: 0.95rem;
            color: #546e7a;
        }

        .link-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        a {
            display: block;
            padding: 1rem 1.25rem;
            font-size: 1.05rem;
            font-weight: 600;
            color: #fff;
            text-decoration: none;
            border-radius: 12px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        a:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        a.naver {
            background: #03c75a;
        }

        a.youtube {
            background: #ff0000;
        }

        a.google {
            background: #4285f4;
        }
    </style>
</head>
<body>
    <main class="link-card">
        <h1>자주 가는 사이트</h1>
        <p class="subtitle">클릭하면 새 탭에서 열려요</p>

        <nav class="link-list">
            <a href="https://www.naver.com" target="_blank" rel="noopener noreferrer" class="naver">
                네이버
            </a>
            <a href="https://www.youtube.com" target="_blank" rel="noopener noreferrer" class="youtube">
                유튜브
            </a>
            <a href="https://www.google.com" target="_blank" rel="noopener noreferrer" class="google">
                구글
            </a>
        </nav>
    </main>
</body>
</html>
