<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 소개 페이지 | 서희정</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
            background: linear-gradient(160deg, #fffde7 0%, #fff176 30%, #ffee58 55%, #ffeb3b 100%);
            color: #3e2723;
        }

        .profile-card {
            width: min(420px, 100%);
            padding: 2.75rem 2.25rem;
            text-align: center;
            background: rgba(255, 255, 255, 0.92);
            border: 3px solid #ffeb3b;
            border-radius: 24px;
            box-shadow:
                0 20px 40px rgba(255, 235, 59, 0.45),
                0 0 0 6px rgba(238, 21, 21, 0.12);
        }

        .profile-photo {
            display: block;
            width: 96px;
            height: 96px;
            margin: 0 auto 1.5rem;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ffeb3b;
            outline: 3px solid #ee1515;
            box-shadow: 0 8px 20px rgba(255, 235, 59, 0.6);
        }

        h1 {
            font-size: 2.25rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 0.35rem;
            color: #2c2416;
            text-shadow: 0 2px 0 #fff9c4;
        }

        h2 {
            font-size: 1.05rem;
            font-weight: 600;
            color: #c62828;
            margin-bottom: 2rem;
            padding-bottom: 2rem;
            border-bottom: 2px dashed #ffeb3b;
        }

        h3,
        h4 {
            font-size: 0.95rem;
            font-weight: 500;
            line-height: 1.6;
            color: #4e342e;
            padding: 0.85rem 1rem;
            margin-bottom: 0.75rem;
            border-radius: 12px;
            background: #fffde7;
            border: 2px solid #fff176;
        }

        h3::before {
            content: "🎮 ";
        }

        h4 {
            margin-bottom: 0;
        }

        h4::before {
            content: "🍜 ";
        }
    </style>
</head>
<body>
    <main class="profile-card">
        <img class="profile-photo" src="./photo.jpg" alt="서희정 프로필 사진" />
        <h1>서희정</h1>
        <h2>웹개발자(연습중)</h2>
        <h3>취미: 게임, 산책, 코딩</h3>
        <h4>좋아하는 음식: 떡볶이</h4>
    </main>
</body>
</html>
