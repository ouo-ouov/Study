<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Insert title here</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #222;
        }

        .signup-container {
            max-width: 760px;
            margin: 40px auto;
            padding: 24px;
        }

        .signup-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            padding: 24px;
        }

        .signup-title {
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .signup-table {
            width: 100%;
            border-collapse: collapse;
            background: transparent;
        }

        .signup-table td {
            padding: 10px;
            border: 1px solid #dce4ef;
            vertical-align: top;
        }

        .signup-table input[type="text"],
        .signup-table input[type="password"],
        .signup-table select,
        .signup-table textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #cfd8e3;
            border-radius: 8px;
            font-size: 14px;
        }

        .signup-table textarea {
            min-height: 100px;
            resize: vertical;
        }

        .signup-table button,
        .signup-table input[type="button"] {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: #fff;
            cursor: pointer;
        }

        .signup-table button:hover,
        .signup-table input[type="button"]:hover {
            background: #1d4ed8;
        }

        span {
            color: red;
        }

        @media (max-width: 600px) {
            .signup-container {
                padding: 16px;
                margin: 20px auto;
            }

            .signup-card {
                padding: 16px;
            }

            .signup-table td {
                display: block;
                width: 100%;
            }
        }
    </style>
</head>

<body>
  <div class="signup-container">
    <div class="signup-card">
      <div class="signup-title">회원가입</div>

      <table class="signup-table">
        <tr>
            <td colspan="2" align="center">회원가입</td>
        </tr>
        <tr>
            <td>*이름</td>
            <td>
                <input type="text" name="uName" id="uName" placeholder="김개똥" />
                <span id="name">이름을 입력해주세요</span>
            </td>
        </tr>
        <tr>
            <td>*ID</td>
            <td>
                <input type="text" name="uID" id="uID" placeholder="admin" />
                <span id="id">ID를 입력해주세요</span>
            </td>
        </tr>
        <tr>
            <td>*비밀번호</td>
            <td>
                <input type="password" name="uPWD" id="uPWD" placeholder="1234" />
                <span id="pwd">비밀번호를 입력해주세요</span>
            </td>
        </tr>
        <tr>
            <td>*비밀번호 확인</td>
            <td>
                <input type="password" name="uPWD_Confirm" id="uPWD_Confirm" />
                <span id="pwd_confirm">비밀번호 확인란 입력해주세요</span>
            </td>
        </tr>
        <tr>
            <td>*주소</td>
            <td>
                <input type="text" id="sample6_postcode" placeholder="우편번호">
                <input type="button" onclick="sample6_execDaumPostcode()" value="우편번호 찾기"><br>
                <input type="text" id="sample6_address" placeholder="주소"><br>
                <input type="text" id="sample6_detailAddress" placeholder="상세주소">
                <input type="text" id="sample6_extraAddress" placeholder="참고항목">     
            </td>
        </tr>
        <tr>
            <td>*직업</td>
            <td>
                <select name="work" id="work">
                    <option value="직업명" selected>직업명</option>
                    <option value="기타">기타</option>
                    <option value="회사원">회사원</option>
                    <option value="학생">학생</option>
                </select>
                <span id="work-error">직업 하나를 선택해 주세요</span>
            </td>
        </tr>
        <tr>
            <td>*성별</td>
            <td>
                남자<input type="radio" name="sex" id="s1" value="male" />
                여자<input type="radio" name="sex" id="s2" value="female" />
                <span id="gender-error">성별을 체크해 주세요</span>
            </td>
        </tr>
        <tr>
            <td>*취미</td>
            <td>
                <input type="checkbox" name="hobby" id="h1" value="독서" />독서
                <input type="checkbox" name="hobby" id="h2" value="등산" />등산
                <input type="checkbox" name="hobby" id="h3" value="낚시" />낚시
                <span id="hobby-error">취미를 하나이상 체크 해 주세요</span>
            </td>
        </tr>
        <tr>
            <td>*가입동기</td>
            <td>
                <textarea rows="20" cols="100" name="motivation" placeholder="가입동기를 두줄 이상 입력 하시오."></textarea>
                <br><span id="motivation-error">가입 동기를 입력해주세요</span>
            </td>
        </tr>
        <tr>
            <td colspan="2" align="center">
                <input type="button" value="가입" id="submit" />
            </td>
        </tr>
    </table>

    <!-- 카카오 우편번호 API 서비스 적용 -->
    <script src="//t1.kakaocdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script>
    //------------------------- 카카오 우편번호 주소 API 관련 코드 -------------------------------
    function sample6_execDaumPostcode() {
        new kakao.Postcode({
            oncomplete: function(data) {
                // 팝업에서 검색결과 항목을 클릭했을때 실행할 코드를 작성하는 부분.

                // 각 주소의 노출 규칙에 따라 주소를 조합한다.
                // 내려오는 변수가 값이 없는 경우엔 공백('')값을 가지므로, 이를 참고하여 분기 한다.
                var addr = ''; // 주소 변수
                var extraAddr = ''; // 참고항목 변수

                //사용자가 선택한 주소 타입에 따라 해당 주소 값을 가져온다.
                if (data.userSelectedType === 'R') { // 사용자가 도로명 주소를 선택했을 경우
                    addr = data.roadAddress;
                } else { // 사용자가 지번 주소를 선택했을 경우(J)
                    addr = data.jibunAddress;
                }

                // 사용자가 선택한 주소가 도로명 타입일때 참고항목을 조합한다.
                if(data.userSelectedType === 'R'){
                    // 법정동명이 있을 경우 추가한다. (법정리는 제외)
                    // 법정동의 경우 마지막 문자가 "동/로/가"로 끝난다.
                    if(data.bname !== '' && /[동로가]$/.test(data.bname)){
                        extraAddr += data.bname;
                    }
                    // 건물명이 있고, 공동주택일 경우 추가한다.
                    if(data.buildingName !== '' && data.apartment === 'Y'){
                        extraAddr += (extraAddr !== '' ? ', ' + data.buildingName : data.buildingName);
                    }
                    // 표시할 참고항목이 있을 경우, 괄호까지 추가한 최종 문자열을 만든다.
                    if(extraAddr !== ''){
                        extraAddr = ' (' + extraAddr + ')';
                    }
                    // 조합된 참고항목을 해당 필드에 넣는다.
                    document.getElementById("sample6_extraAddress").value = extraAddr;
                
                } else {
                    document.getElementById("sample6_extraAddress").value = '';
                }

                // 우편번호와 주소 정보를 해당 필드에 넣는다.
                document.getElementById('sample6_postcode').value = data.zonecode;
                document.getElementById("sample6_address").value = addr;
                // 커서를 상세주소 필드로 이동한다.
                document.getElementById("sample6_detailAddress").focus();
            }
        }).open();
    }
    //--------------------------------------------------------------------------------------------
    const verificationType = {

        NAME : 0, //이름 항목 인덴스 : 0
        ID   : 1, //아이디 항목 인덴스 : 1
        PWD  : 2, //비빌번호 항목 인덱스 : 2
        PWD_CONFIRM : 3, //비빌번호 확인(재입력) 항목 인덱스 : 3
        JOB  : 4, //직업 선택 항목 인덱스 : 4
        GENDER : 5, //성별 선택 항목 인덱스 : 5
        HOBBY  : 6, //취미(체크박스) 항목 인덱스 : 6
        MOTIVATION : 7, //가입동기(textarea) 항목 인덱스 : 7 
    };
    
    /*
        참고. Object.freeze()란?
            - 위 freeze 메소드의 기능은 자바스크립트의 내장 메서드로,
              객체를 "동결(freeze)" 시켜 불변 상태로 만드는 함수입니다.
              즉, 객체의 속성을 추가, 수정, 삭제할 수 없게 잠그는 기능을 합니다.
    */
    //Object.freeze 메소드는 전달한 객체를 더 이상 수정할 수 없게 만듭니다.
    //이렇게 하면 이후 코드에서 누군가 실수로 verificationType 객체의 속성:값 형태를 변경하는 것을 방지합니다.
    Object.freeze(verificationType);

    //--------------------------유효성 검사 결과 값들을 저장할 배열 초기화 -------------------------------
    //checkVerifications 배열은 각 항목의 '검증 통과 여부'를 true 또는 false로 저장한다.
    //초기값은 모두 false(아직 검사하지 않았거나, 미통과 상태)로 설정한다.

    //배열은 빈 상태의 배열 선언
    let checkVerifications = [];

    //참고. Object.keys(verificationType).length는
    // [NAME, ID, PWD, PWD_CONFIRM, JOB, GENDER, HOBBY, MOTIVATION].length
    
    // 위에 정의한 verificationType 객체의 속성(키)의 개수 8을 반환합니다.

    //verificationType 객체에 만들어져 있는 속성의 개수만큼 false를 checkVerifications 배열에 넣어 저장
    for(let i=0; i<Object.keys(verificationType).length; i++){
//               i<8;
        checkVerifications.push(false); //push 메소드로 배열 끝에 false 반복해서 추가                 
    }
    // checkVerifications 배열 모습
    // [false, false, false, false, false, false, false, false]
    //    0      1      2      3      4      5      6      7    index

    //모두 false가 저장된 것의 의미 : 유효성 검사 통과 하지 않음
    //모두 true가 저장된 것의 의미 : 유효성 검사 통과 했음

    //------------------------- 이름 유효성 검사 -----------------------------
    const inputName = document.getElementById("uName"); //<input id="uName"> 이름 입력 요소 선택
    const nameError = document.getElementById("name");  //<span id="name">이름을 입력해주세요</span> 요소 선택
    //사용자가 키 입력(키를 누르고 땔 때)이벤트를 <input id="uName">에 등록
    inputName.addEventListener("keyup", validateName);

    //validateName 함수 : 이름이 비어 있지 않는지 검사하고 결과(true 또는 false)를
    //                    checkVerifications 배열에 저장
    function validateName(){
        
        if(inputName.value.trim() === ""){ //이름 입력 하지 않았다면?

            //사용자에게 안내메세지를 보여주기 위해 안내메세지 "이름을 입력해 주세요" 를
            //<span id="name">이름을 입력해주세요</span> 이렇게 넣어서 보여주자   
            nameError.innerText = "이름을 입력해 주세요";

            //검증 결과 값을 checkVerifications 배열의 0 index 칸에 false로 저장
            checkVerifications[verificationType.NAME] = false;
          //checkVerifications[         0           ] = false;
        }else{
            //이름을 입력 했다면? 오류 메세지를 지우고 통과 표시
            nameError.innerText = "";
            //검증 결과 값을 checkVerifications 배열의 0 index 칸에 true로 저장
            checkVerifications[verificationType.NAME] = true;
          //checkVerifications[         0           ] = true;
        }
    }//validateName() 함수 끝

    //--------------------------- 아이디 유효성 검사 ----------------------------------
    //아이디 입력 <input>과 해당 오류메세지 표시할 <span> 요소를 선택해서 가져온다.
    const inputId = document.getElementById("uID");
    const idError = document.getElementById("id");

    //아이디 입력 <input>에 키를 누르고 있다가 뗀 동작(keyup이벤트) 등록
    inputId.addEventListener("keyup", validateID);

    //이벤트 핸들러 함수 validateID 정의
    //기능 : 아이디를 입력했는지 검사, 아이디 입력시 3 ~ 7 입력 안 했는지 검사, 제대로 둘 다 입력 했는지 검사
    function validateID(){

        if(inputId.value.trim() === ""){

            idError.innerText = "아이디를 입력해 주세요";
            checkVerifications[verificationType.ID] = false;
        }else if(inputId.value.trim().length < 3 || inputId.value.trim().length > 7){ // 아이디 입력 했고, 3 ~ 7 사이로 입력하지 않았다면?

            idError.innerText = "3 ~ 7자로 입력해 주세요";
            checkVerifications[verificationType.ID] = false;
        }else{ // 아이디 입력 했고, 3 ~ 7자 사이로 입력 했다면?

            idError.innerText = "";
            checkVerifications[verificationType.ID] = true;
        }
    } // validateID() 함수 끝

    //---------------------------- 비밀번호 유효성 검사 -----------------------------------------
    const inputPwd = document.getElementById("uPWD");
    const pwdError = document.getElementById("pwd");

    inputPwd.addEventListener("keyup", validatePWD);

    function validatePWD(){

        if(inputPwd.value.trim() === ""){

            pwdError.innerText = "비밀번호를 입력해 주세요";
            checkVerifications[verificationType.PWD] = false;
        }else if(inputPwd.value.trim().length < 4 || inputPwd.value.trim().length > 10){

            pwdError.innerText = "4 ~ 10자로 입력해 주세요";
            checkVerifications[verificationType.PWD] = false;
        }else{

            pwdError.innerText = "";
            checkVerifications[verificationType.PWD] = true;
        }
    }

    //-------------------------- 비밀번호 재입력(확인) 검사 ------------------------------
    //비밀번호 확인 입력창 input과 오류 메세지 보여줄 <span>요소를 선택해서 가져온다.
    
    const inputPwdConfirm = document.getElementById("uPWD_Confirm");
    const pwdConfirmError = document.getElementById("pwd_confirm");
    
    //비밀번호 확인 입력창 input에 keyup 이벤트 등록 후 처리
    inputPwdConfirm.addEventListener("keyup", () => {

        if(inputPwdConfirm.value.trim() === ""){

            pwdConfirmError.innerText = "비밀번호 확인해 주세요";
            checkVerifications[verificationType.PWD_CONFIRM] = false;

        // 입력한 비밀번호와 비밀번호확인 입력창에 입력한 비밀번호가 일치하지 않느냐?
        }else if(inputPwd.value.trim() !== inputPwdConfirm.value.trim()){ 

            pwdConfirmError.innerText = "두 비밀번호가 다릅니다";
            checkVerifications[verificationType.PWD_CONFIRM] = false;

        }else{//비밀번호 확인 입력창에 비밀번호 입력했고, 두 비밀번호가 일치하다면?

            pwdConfirmError.innerText = "";
            checkVerifications[verificationType.PWD_CONFIRM] = true;
        }
    });

    // ------------------------- 직업 선택 검사 -------------------------------------
    //직업 선택 드롭다운(<select>요소)과 오류 메세지 보여질 <span> 요소 선택해서 가져온다.
    const selectWork = document.getElementById("work");
    const workError = document.getElementById("work-error");

    //<select> 요소 내부에 작성된 <option>들 중에서 하나를 선택하는 동작(change 이벤트) 등록 처리
    selectWork.addEventListener("change", () => {

        //1. 직업선택을 위해 3개의 <option>이 있는데 하나도 선택하지 않았다면?
        if(selectWork.value === "직업명"){

            workError.innerText = "직업을 선택해 주세요";
            checkVerifications[verificationType.JOB] = false;

        //2. 직업선택을 위해 3개의 <option>중에 하나라도 선택 했다면?    
        }else{
            
            workError.innerText = "";
            checkVerifications[verificationType.JOB] = true;
        }
    });

    //------------------------------ 성별 선택 검사 ----------------------------------
    //성별 선택은 라디오 버튼 2개로 구성되어 있고, 둘 다 name="sex" 로 동일한 이름을 가지고 있음
    //document.getElementsByName('sex') 메소드는
    //같은 name 속성 값 sex를 가진 모든 요소를 NodeList(유사배열)에 담아 반환
    //요약 : 라디오 버튼 요소 2개 NodeList 유사배열에 담아 선택해 오자
    const radioGenders = document.getElementsByName("sex");
    const genderError = document.getElementById("gender-error");

    //NodeList 배열인 radioGenders 에 대해 forEach() 메소드 사용!
    //-> 각 라디오 버튼에 change 이벤트를 반복해서 각각 등록 후
    //   각 라디오 버튼이 선택될 때마다 이벤트 처리 함수 실행되게 하자
    radioGenders.forEach((element) => {

        element.addEventListener("change",() => {

            //change 이벤트가 발생하면 (두 라디오 버튼 중 하나를 선택하면) 처리 할 코드 작성
            //1. 성별 선택하는 라디오 버튼 둘 다 선택하지 않았느냐?
            if(!radioGenders[0].checked && !radioGenders[1].checked){ // !true -> false

                genderError.innerText = "성별을 체크해 주세요";
                checkVerifications[verificationType.GENDER] = false;  // <--- 유효성 실패
            }else{ //2. 성별 선택하는 라이도 버튼 두개중 하나라도 선택이 되었느냐?

                genderError.innerText = "";
                checkVerifications[verificationType.GENDER] = true; // <--- 유효성 통과
            }
        });
    });
    
    //----------------------------- 취미 체크 검사 -------------------------------------
    //취미 체크 박스들 (name="hobby")을 모두 배열에 담아 선택해 옵니다.
    const checkHobbies = document.getElementsByName("hobby");
    //취미 오류 표시 <span></span> 요소 선택
    const hobbyError = document.getElementById("hobby-error");

    //각 체크 박스 요소에 상태 변경 이벤트(체크/체크 해제 된 change 이벤트) 발생시 이벤트 핸들러 함수 실행되게 작성

    checkHobbies.forEach((element) => {

        element.addEventListener("change", () => {

            //플래그변수 let flag : 체크박스 중 하나라도 체크되면? true 저장, 체크되어 있지 않으면 false 저장
            let flag = false;

            //checkHobbies배열.forEach() 메소드를 이용하여 하나라도 체크 되어 있으면? flag 변수값 true로 저장 시키자
            checkHobbies.forEach((checkbox) => {

                if(checkbox.checked) flag = true;
            });
            
            if(flag){ //하나라도 체크 되어 있다면?

                hobbyError.innerText = "";  //오류메세지 제거를 위해 "" 넣기
                checkVerifications[verificationType.HOBBY] = true;
            }else{ //모두 체크되어 있지 않다면?

                hobbyError.innerText = "취미를 하나 이상 체크해 주세요";
                checkVerifications[verificationType.HOBBY] = false; //<- 모두 미체크 된 상태이니 실패
            }
        });
    });

    //---------------------------- 가입 동기 (textarea) 검사 -------------------------------
    //가입 동기 textarea 요소는 name="motivation" 으로 되어 있으며 getElementsByName() 으로 배열에 담아 선택해온다.
    //반환 받은 배열의 0 index에 저장된 <textarea name="motivation"></textarea> 요소를 꺼내와 저장
    const areaMotivation = document.getElementsByName("motivation")[0];

    //가입 동기 오류 메세지 표시 <span id="motivation-error"></span> 요소 선택 해서 저장
    const motivationError = document.getElementById("motivation-error");

    //textarea요소에 keyup 이벤트 등록 후 이벤트 핸들러 함수 처리 하게 정의
    areaMotivation.addEventListener("keyup", function(){

        //입력한 줄 수가 2줄 이상인지 검사
        let lineCount = areaMotivation.value.split(/\r*\n/).length;

        if(lineCount >= 2){

            //textarea 요소에 입력한 가입동기가 2줄 이상이면 통과
            motivationError.innerText = "";
            checkVerifications[verificationType.MOTIVATION] = true;

        }else{

            //textarea 요소에 입력한 가입동기가 2줄 미만이면 안내메세지를 보여주고 실패처리
            motivationError.innerText = "가입 동기를 두 줄 이상 입력해 주세요";
            checkVerifications[verificationType.MOTIVATION] = false;
        }
    });

    //---------------------------- 가입 버튼 클릭시 처리 -----------------------------------

    //가입 버튼 <input type="button" value="가입" id="submit"/> 요소를 선택하고 click 이벤트 등록

        /*
            checkVerifications.every((bool) => {return boll;}); 메소드는 배열의 모든 요소가 true인지 검사한다.
            배열에 하나라도 false가 있으면? 전체 결과는 false를 반환하지만
            배열에 모두 true가 저장되어 있으면? 전체 결과는 true 하나로 반환 합니다.
        */
    document.querySelector("#submit").addEventListener("click", () => {

        //모든 입력 항목에 이상없이 유효성 검사에 통과 되었다면?
        if(checkVerifications.every(bool => bool)){

            alert("회원가입 요청이 완료 됩니다...");
        }
    });




    </script>
