<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //함수 외부 영역(전역 스코프)
        let a = 10;   //전역변수메모리 a
        const b = 20; //전역상수메모리 b 

        function sum(){
            //함수 내부 영역(지역 스코프)
            let a = 50;   //지역변수메모리 a
            const b = 70; //지역상수메모리 b

            console.log(`함수 내부 a변수값 출력 : ${a}`); //50
            console.log(`함수 내부 b변수값 출력 : ${b}`); //70

        }
        sum(); //함수 호출

        console.log(`함수 외부 a변수값 출력 : ${a}`); //10
        console.log(`함수 외부 b변수값 출력 : ${b}`); //20



    </script>
    
</body>
</html>
