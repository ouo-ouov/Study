<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; line-height: 1.7; padding: 30px; }
        h1 { color: #1d4ed8; }
        .box { border: 2px solid #dbeafe; background: #eff6ff; padding: 16px; border-radius: 10px; margin: 16px 0; }
        table { border-collapse: collapse; width: 100%; max-width: 720px; }
        th, td { border: 1px solid #94a3b8; padding: 10px; text-align: center; }
        form { max-width: 520px; padding: 18px; border: 1px solid #cbd5e1; border-radius: 10px; }
        label { display: block; margin-top: 12px; font-weight: 700; }
        input, select, textarea, button { font-size: 16px; padding: 9px; margin-top: 6px; }
        .card { border: 1px solid #cbd5e1; border-radius: 10px; padding: 14px; margin: 10px 0; }
        .highlight { background: #fef3c7; color: #b45309; font-weight: 700; }
      </style>
</head>
<body>
    <!--
        login.html 파일에서 사용하는 body 안 태그 설명

        이 파일의 목적 : 로그인 화면처럼 사용자가 아이디와 비밀번호를 입력하는 전체 디자인(폼) 구조를 연습합니다.

        1. <h1></h1>
            역할 : 페이지의 가장 큰 제목을 보여줍니다.
            의미 : 이 화면이 로그인 입력 폼 실습이라는 것을 알려줍니다.
            작성방법 : <h1>login.html - 아이디/비밀번호 label + input 폼 만들기</h1> 처럼 제목 글자를 태그 사이에 씁니다.

        2. <form></form>
            역할 : 여러 입력 태그(요소)를 하나의 입력 영역으로 묶습니다.
            의미 : 아이디, 비밀번호, 이메일 입력칸과 제출 버튼이 같은 폼에 속한다는 뜻 입니다.
            작성방법 : <form>으로 시작하고 입력 태그들을 넣은 뒤 </form>으로 닫습니다.
        
        3. <label></label>
            역할 : 입력칸의 이름표를 만듭니다.
            의미 : for속성으로 어떤 input태그와 연결 되는지를 알려줍니다.
            작성방법 : <label for="user-pw">비밀번호</label> 처럼 작성하고, for속성의 값은 input태그의 id속성의 값과 같게 맞춥니다.

        4. <input>
            역할 : 한 줄 입력칸을 만듭니다.
            의미 : type 속성의 설정값에 따라 일반 텍스트 입력, 비밀번호 입력, 이메일 입력칸으로 달라집니다.
            작성방법 : <input type="password">
        
        5. <button></button>
            역할 : 폼을 제출하는 클릭 버튼을 만듭니다.
            의미 : type="submit"이라서 버튼을 누르면 form 제출 동작을 하게 됩니다.
            작성방법 : <button type="submit">제출하기<button> 처럼 작성합니다.
    -->

    <!-- h1은 페이지의 가장 큰 제목을 표현합니다. 보통 한 페이지에서 핵심주제를 알려주는 제목으로 사용합니다. -->
    <h1>login.html - 아이디/비밀번호 label + input 폼 만들기</h1>

    <!-- form은 사용자 입력을 모은느 큰 상자 영역입니다. 로그인, 회원가입, 검색처럼 입력칸과 버튼이 함께 있는 부분을 묶을 때 사용 -->
    <form action="index.jsp">

        <!-- label은 입력칸의 이름표를 설정하는 태그 영엽입니다.
             for="user-id"는 input태그의 id="user=id"인 입력칸과 연결되어, 이름표를 클릭해도 해당 입력탄으로 포커스가 자동으로 가게 됩니다. -->
        <label for="user-id">아이디</label>

        <!-- <input>은 한 줄 입력칸입니다. type="text" 는 일반 텍스트 입력, 
                                        id="user-id"는 label태그와 연결되는 고유 이름을 설정하면면
                                        이름표(아이디)를 클릭해도 해당 입력칸에 포커스가 자동으로 가게 해줄 수 있다. 
                                        placeholder속성은 입력 전 안내문구를 값으로 설정하는 속성이다. -->

        <input type="text" id="user-id" placeholder="아이디를 입력하세요">

        <!-- 비밀번호 입력칸의 이름표영역을 만듭니다. for="user-pw"와 input의 id="user-pw"가 같아서 두 태그가 서로 연결됨 -->
        <label for="user-pw">비밀번호</label>

        <!-- 비밀번호용 입력칸 하나를 만듭니다. type="password"라서 사용자가 입력한 비밀번호가 화면에 그대로 보이지 않고 점으로 표시됨 -->
        <input type="password" id="user-pw" placeholder="비밀번호를 입력하세요">

        <!-- 이메일 입력칸의 이름표영역을 만듭니다. for="email"은 아래의 input의 id="email" 입력칸과 서로 연결됨 -->
        <label for="email">이메일</label>

        <!-- 이메일용 입력칸 하나를 만듭니다. type="email"을 쓰면 브라우저가 이메일 형식인지 확인거나 모바일에서 이메일 키보드를 보여줄 때 사용됨 -->
        <input type="email" id="email" placeholder="abc@example.com">

        <!-- 버튼 태그 button입니다. 
             type="sibmit" 이라고 작성하면? 사용자가 입력한 아이디, 비밀번호, 이메일 정보를
             웹브라우저를 통해 웹서버로 전송 하는 역할의 버튼이 만들어집니다.
             주의사항!!!! type="submit" 으로 작성한 <button>태그는 <form></form> 태그 사이에 단 하나만 작성해야한다. -->
         <button type="submit">입력한 로그인 값 요청!</button>

    </form>
</body>
</html>
