<body>
    <!--
        [실습7] 실습A paragraph.html 파일 만들기

        p태그는 문단을 만드는 태그입니다.
        p태그 하나가 문장 묶음 하나라고 생각하면 됩니다.
    -->
        <p>안녕하세요. 저는 홍길동 입니다.</p>
        <p>10살이고 아직 어립니다. 잘 봐주세요.</p>
    <!-- hr 태그는 화면에 가로 구분선을 보여주는 태그입니다. 내용 사이를 나눌 때 사용합니다. -->
        <hr>
        
        <P>취미는 코딩입니다.</P>

    <!-- br 태그는 같은 문단 안 에서 줄만 바꾸고 싶을 때 사용하는 태그 입니다. -->
        <p>잘 부탁드립니다.<br><br></bt>감사합니다.</p>
