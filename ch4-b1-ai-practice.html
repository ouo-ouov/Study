<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<!-- 
    [초보자 가이드]
    - ul 태그 : unordered list의 약자, 순서 없는 목록을 만들 때 사용해요!
    - li 태그 : list item의 약자, 목록의 항목 하나하나를 감싸줘요.
    - 스타일은 style 속성에 직접 작성할 수도 있어요.
    - 연한 초록색 예시는 #e0ffe5 정도가 좋아요!
    예시)
    <ul style="background-color: #e0ffe5; padding: 20px; border-radius: 12px; width: 230px;">
        <li style="padding:8px 0; font-size:1.1em; color: #24b353;">...</li>
    </ul>
    ↓ 아래 코드 참고해서 써보세요 :)
-->
<ul style="background-color: #e0ffe5; padding: 24px 36px; border-radius: 12px; width: 260px; box-shadow: 0 2px 8px #b8f2ca66;">
    <li style="color: #24b353; font-weight: bold; margin-bottom: 8px; font-size:1.1em;">떡볶이</li>
    <li style="color: #24b353; font-weight: bold; margin-bottom: 8px; font-size:1.1em;">라면</li>
    <li style="color: #24b353; font-weight: bold; margin-bottom: 8px; font-size:1.1em;">치킨</li>
    <li style="color: #24b353; font-weight: bold; margin-bottom: 8px; font-size:1.1em;">피자</li>
    <li style="color: #24b353; font-weight: bold; font-size:1.1em;">햄버거</li>
</ul>
</body>
</html>
