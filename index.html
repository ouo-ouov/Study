<!--
HTML
-Hyper Text Markup Language
-웹 페이지를 만들기 위한 언어
-웹 페이지는 태그들로 구성되어 있다
-태그 작성 문법
  <태그명 속성="값"> 내용 </태그명>
  <태그명 속성="값">  
-->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    <body>
        <!--   <- 주석 기호 : 태그에 대한 설명을 작성하는 영역의 기호   --> 
        <!-- [실습1] 실습A index.html 파일만들기 -->
        <!-- h1 태그는 브라우저 화면에 가장 큰 제목을 보여줄 때 사용하는 태그입니다.   -->
         <h1>HTML 실습 시작</h1>
         <h2>HTML 실습 시작</h2>
         <h3>HTML 실습 시작</h3>
         <h4>HTML 실습 시작</h4>
         <h5>HTML 실습 시작</h5>
         <h6>HTML 실습 시작</h6>


        <!-- p태그는 문장이나 문단을 화면에 감싸서 보여줄 때 사용하는 태그입니다. -->
         <p>이 파일은 index.html 입니다.</p>


    </body>
</html>
