<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<style>
  .card-container {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 80vh;
    background: #f6f8fb;
    padding: 50px 0;
  }
  .card {
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.18);
    padding: 36px 38px 32px 38px;
    max-width: 420px;
    min-width: 320px;
    margin: 24px;
  }
  .card-title {
    font-size: 2rem;
    font-weight: bold;
    color: #2e3a4b;
    text-align: center;
    margin-bottom: 22px;
    letter-spacing: 1px;
  }
  .pretty-ol {
    counter-reset: step-num;
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .pretty-ol li {
    background: #edf2fb;
    border-radius: 12px;
    margin-bottom: 16px;
    position: relative;
    padding: 18px 22px 18px 58px;
    font-size: 1.11rem;
    color: #384657;
    box-shadow: 0 2px 10px rgba(124, 144, 255, 0.09);
    transition: background 0.2s;
  }
  .pretty-ol li:last-child {
    margin-bottom: 0;
  }
  .pretty-ol li::before {
    counter-increment: step-num;
    content: counter(step-num);
    position: absolute;
    left: 20px;
    top: 50%;
    transform: translateY(-50%);
    background: linear-gradient(135deg, #667eea 60%, #a6ffcb 100%);
    color: #fff;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    box-shadow: 0 3px 12px rgba(124, 144, 255, 0.18);
    font-size: 1.08rem;
    letter-spacing: -1px;
    border: 2px solid #fff;
  }
</style>
<div class="card-container">
  <div class="card">
    <div class="card-title">라면 끓이는 6단계</div>
    <ol class="pretty-ol">
      <li>물을 냄비에 붓고 끓입니다.</li>
      <li>물이 끓으면 스프를 넣어줍니다.</li>
      <li>면을 넣고 젓가락으로 잘 풀어줍니다.</li>
      <li>취향에 따라 파, 계란, 야채 등을 넣어줍니다.</li>
      <li>3~4분 정도 더 끓이면서 면을 익힙니다.</li>
      <li>불을 끄고 그릇에 담아 맛있게 먹어요!</li>
    </ol>
  </div>
</div>
</body>
</html>
