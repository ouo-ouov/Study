<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

</head>
<body>
    <!-- 2. <div></div>
            역할 : 여러 내용을 하나의 구역으로 묶습니다.
            의미 : id="intro"는 고유한 구역 이름이고, class="card"는 카드 디자인을 적용하는 이름표입니다.

         4. <span></span>
            역할 : 문장 안의 일부 단어만 묶습니다.
            의미 : 중요한 단어에 class="highlight"를 붙여 노란 배경으로 강조합니다.
            작성방법: <span class="highlight"> 중요한 단어 </span> 처럼 작성합니다. -->
        
        <h1>goruping.html = div + span</h1>

        <!-- div요소는 여러 내용을 묶는 빈 상자 같은 태그입니다. -->
        <div id="intro" class="card">
            <p>이 문장 안의 <span>중요한 단어</span>를 강조합니다.</p>
        </div>

        <div class="card">
            <p>같은 class속성의 값을 card라고 작성하면 여러 div박스영역을 같은 디자인 방식으로 관리 할 수 있다.</p>
        </div>
</body>
</html>
