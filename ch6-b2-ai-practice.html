<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 2rem 1rem;
            font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
            background: linear-gradient(180deg, #f4f7fb 0%, #eef2ff 45%, #f8fafc 100%);
            color: #111827;
        }

        .card {
            width: min(520px, 100%);
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(17, 24, 39, 0.08);
            border-radius: 18px;
            box-shadow: 0 18px 50px rgba(15, 23, 42, 0.10);
            padding: 2rem 1.75rem;
        }

        h1 {
            font-size: 1.5rem;
            letter-spacing: -0.02em;
            margin-bottom: 0.4rem;
        }

        .sub {
            color: #6b7280;
            line-height: 1.7;
            margin-bottom: 1.5rem;
        }

        form {
            display: grid;
            gap: 1rem;
        }

        .field {
            display: grid;
            gap: 0.45rem;
        }

        label {
            font-size: 0.95rem;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 0.85rem 0.95rem;
            border-radius: 12px;
            border: 1px solid rgba(17, 24, 39, 0.14);
            background: #ffffff;
            color: #111827;
            outline: none;
        }

        input::placeholder {
            color: #9ca3af;
        }

        input:focus {
            border-color: rgba(99, 102, 241, 0.55);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.14);
        }

        .actions {
            display: flex;
            gap: 0.75rem;
            margin-top: 0.25rem;
        }

        button {
            flex: 1;
            padding: 0.9rem 1rem;
            border-radius: 12px;
            border: 1px solid rgba(17, 24, 39, 0.10);
            background: #4f46e5;
            color: #ffffff;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #4338ca;
        }

        .reset {
            background: #ffffff;
            color: #374151;
        }

        .reset:hover {
            background: #f3f4f6;
        }

        .hint {
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #6b7280;
            line-height: 1.7;
        }

        code {
            padding: 2px 6px;
            border-radius: 8px;
            background: rgba(99, 102, 241, 0.10);
            border: 1px solid rgba(99, 102, 241, 0.18);
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>회원가입</h1>
        <p class="sub">아래 폼에는 <code>text</code>/<code>password</code>/<code>email</code>/<code>number</code> 입력이 모두 들어있어요.</p>

        <form action="#" method="post">
            <div class="field">
                <label for="name">이름 (text)</label>
                <input id="name" name="name" type="text" placeholder="예: 서희정" required />
            </div>

            <div class="field">
                <label for="pw">비밀번호 (password)</label>
                <input id="pw" name="password" type="password" placeholder="8자 이상 입력" required />
            </div>

            <div class="field">
                <label for="email">이메일 (email)</label>
                <input id="email" name="email" type="email" placeholder="예: heejung@example.com" required />
            </div>

            <div class="field">
                <label for="age">나이 (number)</label>
                <input id="age" name="age" type="number" placeholder="예: 20" min="0" max="130" required />
            </div>

            <div class="actions">
                <button type="submit">제출하기</button>
                <button class="reset" type="reset">초기화</button>
            </div>
        </form>

        <p class="hint">팁: 입력칸을 클릭해보면 포커스 스타일이 보여요. 이메일은 형식이 맞지 않으면 제출이 안 됩니다.</p>
    </main>
</body>
</html>
