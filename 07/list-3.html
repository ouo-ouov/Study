<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>불릿 이미지 사용하기</title>
  <style>
  /* -----------------------
    .inside 클래스 선택자: 목록 들여쓰기 조정
  ------------------------*/
  .inside{
    list-style-position: inside;  
    /* list-style-position → 리스트 항목 글머리표 위치 지정
      값 inside → 글머리표(불릿)가 텍스트 안쪽으로 들어가서 
                  항목 첫 글자와 같은 줄에 표시
      기본값은 outside → 글머리표가 텍스트 바깥쪽, 들여쓰기 효과 발생
      → 클래스 적용 시 글머리표가 글자와 같은 위치에서 시작 */
  }
  </style>
</head>
<body>
  <h1>도서 시리즈</h1>
  <ul>
    <li>Do it! 시리즈</li>
    <li>된다 시리즈</li>
    <li>DCM 프로 사진가</li>
  </ul>

  <ul class="inside">
    <li>Do it! 시리즈</li>
    <li>된다 시리즈</li>
    <li>DCM 프로 사진가</li>
  </ul>
</body>
</html>
