<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="UTF-8">
		<title>표 스타일</title>
    <style>
		table {
			border-collapse: collapse;
			/* border-collapse -> 테이블과 셀 테두리 처리
			   collapse -> 테두리가 겹쳐 있으면 하나의 선으로 표시 */

			caption-side: bottom;
			/* caption-side -> <caption> 요소 위치 지정
			   값 bottom -> 표 아래쪽에 위치 */
			border: 1px solid #222;
		}

		td, th {
			border: 1px dotted #222;
			padding: 10px;
			/* 셀 안쪽 여백
			   내용과 테두리 사이 10px 공간 확보 */
			text-align: center;
			/* 텍스트 가운데 정렬 */

		}

	</style>
	</head>
	<body>		
		<h2>상품 구성</h2>
		<table>
			<caption>선물용과 가정용 상품 구성</caption>
			<thead>
				<tr>
					<th>용도</th>
					<th>중량</th>
					<th>갯수</t>
					<th>가격</th>
				</tr>
			</thead>
			<tbody>
				<tr>
					<td rowspan="2">선물용</td>
					<td>3kg</td>
					<td>11~16과</td>
					<td>35,000원</td>
				</tr>
				<tr>
					<td>5kg</td>
					<td>18~26과</td>
					<td>52,000원</td>
				</tr>
				<tr>
					<td rowspan="2">가정용</td>
					<td>3kg</td>
					<td>11~16과</td>
					<td>30,000원</td>
				</tr>   
				<tr>
					<td>5kg</td>
					<td>18~26과</td>
					<td>47,000원</td>
				</tr>
			</tbody>        
		</table>
	</body>
</html>
