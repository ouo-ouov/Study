<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<title>박스모델</title>
	<style>
    /* 모든 <div> 요소에 공통 스타일 적용 */
    div {
      border: 2px solid #222;
      /* 테두리(border) 지정
         2xp -> 테두리 굵기
         solid -> 실선
         #000 -> 검정색
         -> 모든 div 박스에 검정색 실선 테두리 표시 */
      margin-bottom: 20px;
      /* 아래쪽 바깥 여백(margin) 20px
         -> 다음 요소와 20px 간격 띄움 */
    }

    /* class="box1" 작성된 첫 번째 div요소 선택해서 적용 */
    .box1 {
      width: 400px;  /* 박스 너비 고정 400px */
      height: 100px; /* 박스 높이 고정 100px */
      /* px 단위 값 설정 하면? -> 브라우저 크기와 관계없이 항상 같은 크기로 표시 */
    }
    
    /* class="box2" 작성된 두 번재 div요소 선택해서 적용 */
    .box2 {
      width: 50%;    /* 박스 너비를 부모요소(여기서는<body>)의 50%로 설정 */
      height: 100px; /* 박스 높이를 고정 100px */
    }

	</style>
</head>
<body>
  <div class="box1"></div>
  <div class="box2"></div>
</body>
</html>
