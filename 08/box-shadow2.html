<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<title>박스모델</title>
	<style>
		div {
			width: 200px;  /* 콘텐츠 영역의 너비 설정 */
			height: 100px; /* 콘텐츠 영역의 높이 설정 */
			border: 1px solid blue;
			margin: 15px;
			display: inline-block;
			border-radius: 40px; /* 요소의 모서리를 둥글게 만드는 데 사용하는 속성 */
		}

		.box1 {
			/* box-shadow : 수평거리값 수직거리값 흐림정도값 번짐정도값 색상 inset */
			box-shadow: 2px -2px 5px 0px; /* 오른쪽 윗 부분에 그림자 */
		}

		.box2 {
			box-shadow: 5px 5px 15px 5px blue;
		}


	</style>
</head>
<body>
	<div class="box1"></div>
	<div class="box2"></div>
</body>
</html>
