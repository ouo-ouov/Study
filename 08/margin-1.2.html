<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<title>박스모델 - 마진</title>
	<style>
    div {
      width:200px;  /* 박스 너비 200px */
      height:100px; /* 박스 높이 100px */
      display:inline-block;    /* 박스div요소를 인라인 레벨 요소로 변경해서 사용가능 */
      border:1px solid #222; /* 테두리 굵기 1px, 선 종류 실선, 선 색상 짙은회색 */
    }

    /* id="margin1" 라고 작성된 첫 번째 div요소 선택 */
    #margin1 {
      /* 바깥 여백 설정 : 위바깥여백, 오른쪽바깥여백, 아래쪽바깥여백, 왼쪽바깥여백 */
      margin: 50px;
    }

    /* id="margin2" 작성된 두 번째 div요소 선택 */
    #margin2 {
      /* div요소의 바깥 위 여백, 바깥 아래 여백 30px로 설정 / 왼쪽 바깥 여백을 50px로 설정 */
      margin: 30px 50px;
    }

    /* id="margin2" 작성된 세 번째 div요소 선택 */
    #margin3 {
      /* 위, 왼쪽오른쪽, 아래 */
      margin: 30px 20px 50px;
    }

    /* id="margin2" 작성된 네 번째 div요소 선택 */
    #margin4 {
      /* 위 30px, 오른쪽 50px, 아래 30px, 왼쪽, 50px */
      margin: 30px 50px 30px 50px;
    }

    /* id="margin2" 작성된 다섯섯 번째 div요소 선택 */
    #margin5 {
      /* 오른쪽 바깥 여백만 20px만큰 더 띄움 */
      margin-right: 20px;
    }



  
	</style>
</head>
<body>
  <div id="margin1"></div>
  <div id="margin2"></div>
  <div id="margin3"></div>
  <div id="margin4"></div>
  <div id="margin5"></div>
</body>
</html>
