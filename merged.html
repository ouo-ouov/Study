<!DOCTYPE html>
<html lang="en">
<head>
    <!-- 브라우저가 문자를 처리할 수 있는 방식을 charset속성의 값으로 설정
         값 종류 
         UTF-8방식 : 전 세계 문자가 깨지지 않도록 처리하는 방식
         EUC-KR방식 : 한국 문자가 브라우저에 깨져서 보이지 않도록 처리하는 방식
         ISO-8859-1방식 : 유럽 나라들의 문자가 브라우저에 깨져서 보이지 않도록 처리하는 방식 
    -->
    <meta charset="UTF-8">
    <!-- meta태그를 사용해 모든 기기의 해상도 너비에 맞게 모두 보여지게 반응형으로 페이지 설정 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 웹브라우저 탭에 보이는 제목 설정 하는 태그 -->
    <title>Document</title>

    <!-- CSS 언어의 코드를 작성하는 영억 style태그 -->
    <style>

        /* css코드의 설명글 작성 */
        /*
            설명 : 아래 문서에 작성해 놓은 th, td 모두를 한꺼번에 선택해 불러와서
                  스타일 설정을 하겠다! -> { }
                  {
                  속성:값; 
                  속성:값;   -> 불러온 태그들의 스타일 설정하기 위해 속성:값; 형태로 설정
                  }
        */
        th, td {
            border: 1px solid red; /* border속성의 의미는 바깥 테두리 스타일 설정*/
                                     /* 1px 값의 의미는 바깥 테두리 선 굵기 값을 1px로 설정*/
                                     /* solid 값의 의미는 가는 실선으로 설정*/
                                     /* red 값의 의미는 바깥 테두리 선 색상을 빨강으로 설정*/
            /*
                위에서 불러온 모든 th 영역과 td 영역에 작성된 데이터들을 중앙정렬 해서 보이게 설정
                text-align속성 의미는 텍스트 정렬
                center값의 의미는 텍스트를 중앙으로 정렬
            */
            text-align: center;                        

        }

        /*
            table 의미는 아래에 작성된 <table></table> 태그 한 쌍을 불러와서서
            {}불러온 table 태그의 스타일을 설정하겠다!
            border-collapse속성:collapse값; 의미는 셀들 사이의 테두리선을 붙이게 해서 선이 이중으로 보이지 않게 스타일을 설정하겠다!

            width속성:100%값; 의미는 표 <table></table>태그의 너비를
            부모 <body></body>태그 너비에 맞춰 100%로 늘리는 스타일 설정!

        */
        table { border-collapse: collapse; width:100%; }
        
    </style>
</head>
<body>
    <h1>셀 병합 표</h1>

    <!-- table태그는 표 전체를 감싸는 태그 입니다. -->
    <table>
        <!-- <tr></tr>태그 한 쌍은 하나의 행을 의미합니다. -->
        <tr>
            <!-- <th>제목</th>태그는 제목 셀을 만들 때 사용합니다. -->
            <th colspan="2">훈련 과정</th>
        </tr>
        <tr>
            <!-- <td>데이터</td>태그는 데이터 셀을 만들 때 사용합니다. -->
            <td rowspan="2">HTML</td>
            <td>기본 문서 구조</td>
        </tr>
        <tr>
            <td>태그와 속성</td>
        </tr>
    </table>
</body>
</html>
