<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; line-height: 1.7; padding: 30px; }
        h1 { color: #1d4ed8; }
        .box { border: 2px solid #dbeafe; background: #eff6ff; padding: 16px; border-radius: 10px; margin: 16px 0; }
        table { border-collapse: collapse; width: 100%; max-width: 720px; }
        th, td { border: 1px solid #94a3b8; padding: 10px; text-align: center; }
        form { max-width: 520px; padding: 18px; border: 1px solid #cbd5e1; border-radius: 10px; }
        label { display: block; margin-top: 12px; font-weight: 700; }
        input, select, textarea, button { font-size: 16px; padding: 9px; margin-top: 6px; }
        .card { border: 1px solid #cbd5e1; border-radius: 10px; padding: 14px; margin: 10px 0; }
        .highlight { background: #fef3c7; color: #b45309; font-weight: 700; }
      </style>
</head>
<body>
    <!-- [실습17] 실습A timetable.html - 3행 3열 간단한 시간표 만들기 -->

    <h1>나의 시간표</h1>

    <table border="1px"> 

        <!-- 하나의 행을 만들고 싶다! <tr></tr> 한 쌍 필요 -->
        <!-- 하나의 행에 하나의 칸을 만들고 싶다! <td></td> 한 쌍 필요 -->

        <tr>
            <th>시간</th>
            <th>과목</th>
            <th>내용</th>
        </tr>
        <tr>
            <td>1교시</td>
            <td>HTML</td>
            <td>태그 이해</td>
        </tr>
        <tr>
            <td>2교시</td>
            <td>JSP</td>
            <td>코드 이해</td>
        </tr>





    </table>





</body>
</html>
