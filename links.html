<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
    <!-- [실습9] 실습A links.html 파일 만들기
         
         a태그는 로컬PC에 있는 다른 웹페이지나 다른 회사 사이트에 있는 웹페이지를 재요청하는 링크를 만들 때 사용 되는 태그이다.

         문법
             <a href="재요청할 페이지경로">바로가기</a>
        
         브라우저에 표시되는 모습

             바로가기

             ______

         설명
             바로가기 링크를 한 번 클릭하면?
             작동순서 1. 웹브라우저 주소창에 href속성에 적힌 재요청할 페이지 요청주소가 자동으로 적힌다.
             작동순서 2. 재요청할 페이지 요청주소를 웹서버로 전달해서 재요청 한다!
             작동순서 3. 웹서버는 재요청할 페이지응 찾아서 그 코드내용을 브라우저로 전달해서 보여준다.
    -->
        <h1>자주 가는(요청하는) 사이트</h1>

        <!-- a태그의 href속성의 값으로 재요청할 주소를 적습니다. -->
         <a href="https://www.naver.com/index.html">네이버 이동(재요청)</a> <br>
         <a href="https://www.google.com/index.html">구글회사가 운영하는 페이지 재요청 해서 브라우저에 보여줘</a> <br>
         <a href="./index.html">내 PC에 저장된 index.html 페이지 재요청</a>



</body>
</html>
