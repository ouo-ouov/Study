<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 
        [실습3] 실습A rules.html 파일 만들기

        HTML 태그는 대부분 여는 태그와 닫는 태그를 짝으로 작성합니다.
    -->
    <h1>HTML 작성 규칙</h1>   
    
    <!-- 
        속성은 태그에 추가 정보를 적는 부분입니다.
        <img>태그 : 브라우저화면에 이미지를 표시 하는 태그.
         - src속성은 이미지의 경로 위치를 값 형태로 작성하는 속성입니다.
         - src속성에 이미지의 경로 위치를 값 형태로 작성하면 브라우저 화면에 이미지가 표시됩니다.
         - alt속성은 이미지 설명을 텍스트로 설정하는 속성입니다.
         - alt속성은 src속성에 값으로 작성한 이미지가 없을때 대신 텍스트 설명을 브라우저에 보여주는 속성입니다.

        작성방법
                <태그명 속성1="값1"  속성2="값2">
                <img src="이미지 경로" alt="이미지설명">
    -->
                <img src="./photo.jpg"  alt="따라큐" >
    <!--
            <p>문단내용</p> 태그는 한 덩어리의 문장을 보여줄 때 사용하는 태그입니다.
    -->
    <p>태그 이름은 소문자로 쓰고, 포함 관계가 보이도록 들여쓰기 하는 특징이 있습니다.</p>
    

</body>
</html>
