<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- [실습11] 실습A images.html 파일 만들기

         img 태그는 이미지를 웹브라우저 화면에 보여줄 때 사용되는 태그입니다.
    -->


    <!-- 
        src속성의 값은 이미지 파일이 실제 저장된 위치 작성
        alt속성의 값은 이미지 파일이 실제 저장되어 있지 않을 때 이미지를 설명하는 대체 텍스트 작성 
        width속성의 값은 원본이미지 너비 값을 픽셀 단위로 설정을 위해 작성
    -->

    <img 
     src="images/sample.jpg" 
     alt="파치리스" 
     width="225"
     >

    <p>이미지가 보이지 않으면 src 경로와 파일 이름을 먼저 확인합니다.</p>

</body>
</html>
